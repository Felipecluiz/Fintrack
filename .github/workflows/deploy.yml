name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# Secrets do repositório:
#   CLOUDFLARE_API_TOKEN   (Workers Scripts, D1 e Cloudflare Pages — Edit)
#   CLOUDFLARE_ACCOUNT_ID
# Variável do repositório:
#   VITE_API_URL           (ex.: https://fintrack-api-production.<subdominio>.workers.dev)
# O JWT_SECRET de produção é um secret do Worker (wrangler secret put), não do GitHub.

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -w @fintrack/api
      - name: Migrations do D1
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: d1 migrations apply fintrack-db --remote --env production
      - name: Deploy do Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy --env production

  web:
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @fintrack/web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - name: Deploy no Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: pages deploy dist --project-name fintrack-web --branch master
